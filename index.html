  <script>
    window.showAppLoadError = function (reason) {
      var errorOverlay = document.getElementById('app-load-error');
      var errorMessage = document.getElementById('app-load-error-message');
      var message = reason instanceof Error ? reason.message : String(reason || '资源加载失败');

      if (errorMessage) errorMessage.textContent = '错误原因：' + message;
      if (errorOverlay) {
        errorOverlay.classList.add('is-visible');
        errorOverlay.setAttribute('aria-hidden', 'false');
      }
    };

    document.getElementById('app-load-error-refresh').addEventListener('click', function () {
      window.location.reload();
    });
  </script>
