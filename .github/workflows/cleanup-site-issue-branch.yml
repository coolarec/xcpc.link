name: Clean up website submission branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete merged website submission branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.payload.pull_request?.head?.ref || ''
            if (!/^issue\/[0-9]+-add-site$/.test(branch)) {
              core.info(`Ignoring unrelated branch: ${branch || '(empty)'}`)
              return
            }

            const { owner, repo } = context.repo
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              })
              core.info(`Deleted merged branch: ${branch}`)
            } catch (error) {
              if (error?.status === 404 || error?.status === 422) {
                core.info(`Branch already absent: ${branch}`)
                return
              }
              throw error
            }
